<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#78e5d8"/>
      <stop offset="1" stop-color="#1e2575"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="40">
      <stop offset="0" stop-color="white" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chart">
      <!-- polygon(0 70%, 25% 45%, 50% 60%, 75% 20%, 100% 35%, 100% 100%, 0 100%) mapped onto inset rect 9–31 -->
      <polygon points="9,25.4 14.5,16.9 20,21.2 25.5,10.2 31,15.7 31,31 9,31"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#bg)"/>
  <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="37" height="37" rx="10.5" fill="none" stroke="white" stroke-opacity="0.14"/>

  <!-- chart cutout -->
  <rect x="9" y="9" width="22" height="22" rx="3" fill="#181e2e" clip-path="url(#chart)"/>
</svg>
